[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-classifier-benchmark"
version = "0.1.0"
description = "Reproducible text-classifier learning curves versus Jev"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.8,<4", "httpx>=0.27,<1", "xgboost>=2.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jev-bench = "jev_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
